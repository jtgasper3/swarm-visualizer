<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Docker Swarm Monitor</title>
  <link href="https://cdn.jsdelivr.net/npm/vuetify@3/dist/vuetify.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css" rel="stylesheet">
  <link href="https://fonts.bunny.net/css?family=roboto:400,500,700" rel="stylesheet" />

  <style>
    .server-card {
      flex: 1 1 240px;
    }
    #server.v-table>.v-table__wrapper>table>tbody>tr>td, #server.v-table>.v-table__wrapper>table>tbody>tr>th, #server.v-table>.v-table__wrapper>table>tfoot>tr>td, #server.v-table>.v-table__wrapper>table>tfoot>tr>th, #server.v-table>.v-table__wrapper>table>thead>tr>td, #server.v-table>.v-table__wrapper>table>thead>tr>th {
      padding: 0 4px;
    }
    #server.v-table>.v-table__wrapper>table>tbody>tr>th, #server.v-table>.v-table__wrapper>table>tfoot>tr>th, #server.v-table>.v-table__wrapper>table>thead>tr>th {
      height: min-content;
    }
    .v-list-subheader__text {
      flex: 1;
    }

    /* --- filter drawer: one row grammar for nodes, stacks and networks --- */
    .filter-section__header {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 10px 4px 2px;
    }
    .filter-section__title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      opacity: 0.75;
    }
    .filter-tally {
      margin-left: auto;
      flex: none;
      font-size: 0.7rem;
      font-variant-numeric: tabular-nums;
      opacity: 0.6;
    }
    /* Partial state stays in the primary hue on purpose: amber and red already
       mean "degraded" on the node and task cards, and a filter is not a fault. */
    .filter-tally--partial {
      opacity: 1;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 10px;
      color: rgb(var(--v-theme-primary));
      background: rgba(var(--v-theme-primary), 0.12);
    }
    .filter-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 32px;
      padding: 1px 4px;
      border-radius: 6px;
    }
    .filter-row:hover {
      background: rgba(var(--v-theme-on-surface), 0.06);
    }
    .filter-row--indent {
      padding-left: 26px;
    }
    .filter-row__label {
      flex: 1 1 auto;
      min-width: 0;
      padding: 3px 0;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      font-size: 0.875rem;
      text-align: left;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .filter-row__label:focus-visible {
      outline: 2px solid rgb(var(--v-theme-primary));
      outline-offset: 1px;
      border-radius: 3px;
    }
    .filter-row__meta {
      flex: none;
      margin-left: auto;
      font-size: 0.7rem;
      opacity: 0.55;
    }
    .filter-row__only {
      flex: none;
      visibility: hidden;
    }
    .filter-row:hover .filter-row__only,
    .filter-row:focus-within .filter-row__only {
      visibility: visible;
    }
    @media (hover: none) {
      .filter-row__only { visibility: visible; }
    }
    .filter-toggles {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 4px 8px;
      padding: 6px 4px;
    }
    /* Three segmented groups have to fit a 280px drawer, so drop the stock
       64px min-width and let the labels size the buttons. */
    .filter-toggles .v-btn {
      min-width: 0;
      padding-inline: 7px;
      font-size: 0.65rem;
      letter-spacing: 0.02em;
    }
    .filter-toggles .v-btn-group {
      width: 100%;
    }
    .filter-toggles__label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      opacity: 0.6;
    }
    .filter-status {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      padding: 6px 4px 2px;
    }
    .app-bar-filters {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      overflow: hidden;
    }
  </style>
  
  <script type="importmap">
    {
      "imports": {
        "vue": "https://cdn.jsdelivr.net/npm/vue@3/dist/vue.esm-browser.js",
        "vuetify": "https://cdn.jsdelivr.net/npm/vuetify@3/dist/vuetify.esm.js",
        "@vueuse/shared": "https://cdn.jsdelivr.net/npm/@vueuse/shared@12/index.min.mjs",
        "@vueuse/core": "https://cdn.jsdelivr.net/npm/@vueuse/core@12/index.min.mjs"
      }
    }
  </script>
</head>

<body>
  <div id="app">
    <v-app>
      <v-app-bar class="ps-4" flat>
        <v-app-bar-nav-icon v-if="$vuetify.display.lgAndDown" @click="drawer = !drawer" title="Toggle sorting and filtering pane"></v-app-bar-nav-icon>

        <v-app-bar-title>
          <WebSocket @update="updateReceivedData" @not-authorized="getAuthorized()" @state-change="wsState = $event">
            <template #icon="{ state }">
              <v-badge :color="state === 'connected' ? 'success' : state === 'connecting' ? 'warning' : 'error'" dot inline floating :title="state" :aria-label="'Connection: ' + state"></v-badge>
            </template>
          </WebSocket>
          {{ clusterName }}
        </v-app-bar-title>

        <template #append>
            <div class="d-flex ga-2 align-center">
              <!-- A filtered view and a real outage look alike, so say so in the bar. -->
              <div v-if="activeFilters.length && $vuetify.display.mdAndUp" class="app-bar-filters">
                <v-chip v-for="chip in activeFilters" :key="chip.key" size="x-small" label color="primary" variant="tonal">{{ chip.text }}</v-chip>
              </div>
              <v-chip v-else-if="activeFilters.length" size="small" label color="primary" variant="tonal" prepend-icon="mdi-filter"
                :aria-label="activeFilters.length + ' filters active'">{{ activeFilters.length }}</v-chip>
              <v-btn v-if="activeFilters.length" size="small" variant="text" @click="resetFilters()">Reset</v-btn>

              <v-btn v-if="authEnabled" icon="mdi-logout" title="Log out" aria-label="Log out" @click="logout()"></v-btn>
              <!-- <v-btn color="medium-emphasis" icon="mdi-email-outline">
                <v-badge color="error" content="1" dot>
                  <v-icon />
                </v-badge>
              </v-btn>

              <v-divider class="align-self-center" length="24" vertical></v-divider>
 
              <v-btn class="me-2" height="48" icon>
                <v-avatar color="surface-light" image="https://cdn.vuetifyjs.com/images/john.png" size="32" />

                <v-menu activator="parent">
                  <v-list density="compact" nav>
                    <v-list-item append-icon="mdi-cog-outline" link title="Settings"></v-list-item>

                    <v-list-item append-icon="mdi-logout" link title="Logout"></v-list-item>
                  </v-list>
                </v-menu>
              </v-btn>
              -->
            </div>
          </template>
      </v-app-bar>

      <v-navigation-drawer v-model="drawer" color="surface-light" width="280" aria-label="Filter and Sorting">
        <div class="px-2 pb-6">
          <v-defaults-provider :defaults="vuetifyDefaults">

            <!-- Search leads: it narrows this tree as well as the cards. -->
            <div class="pt-3">
              <v-text-field v-model="filters.filterText" color="primary" bg-color="surface" id="search"
                hide-details clearable persistent-clear placeholder="Search" prepend-inner-icon="mdi-magnify"
                rounded="lg" variant="outlined" aria-label="Search stacks, services and nodes">
                <template #clear="{ props: clearProps }">
                  <v-icon v-bind="clearProps" size="18" />
                </template>
              </v-text-field>
            </div>

            <v-btn v-if="matchingServiceIds.length" block class="mt-2" variant="tonal" color="primary" size="small"
              @click="setSelection('services', matchingServiceIds, true)">
              Select {{ matchingServiceIds.length }} matching service{{ matchingServiceIds.length === 1 ? '' : 's' }}
            </v-btn>

            <div class="filter-status">
              <v-chip v-for="chip in filterSummary" :key="chip.key" size="x-small" label
                :color="chip.active ? 'primary' : undefined" :variant="chip.active ? 'tonal' : 'text'">{{ chip.text }}</v-chip>
              <v-btn v-if="activeFilters.length" class="ms-auto" color="primary" @click="resetFilters()">Reset</v-btn>
            </div>

            <div class="filter-toggles">
              <span id="roles" class="filter-toggles__label">ROLE</span>
              <v-btn-toggle v-model="filters.nodeRoles" aria-labelledby="roles">
                <v-btn value="manager">Mgr</v-btn>
                <v-btn :value="false">Any</v-btn>
                <v-btn value="worker">Wkr</v-btn>
              </v-btn-toggle>

              <span id="modes" class="filter-toggles__label">MODE</span>
              <v-btn-toggle v-model="filters.serviceMode" aria-labelledby="modes">
                <v-btn value="replicated">Repl</v-btn>
                <v-btn :value="false">Any</v-btn>
                <v-btn value="global">Global</v-btn>
              </v-btn-toggle>

              <span id="task-state" class="filter-toggles__label">STATE</span>
              <v-btn-toggle v-model="filters.taskStateFilter" aria-labelledby="task-state">
                <v-btn value="healthy">Healthy</v-btn>
                <v-btn :value="false">Any</v-btn>
                <v-btn value="failed">Stopped</v-btn>
              </v-btn-toggle>
            </div>

            <filter-section title="NODES" :state="nodesState" :open="isSectionOpen('NODES')"
              @update:open="toggleSection('NODES')" @toggle="toggleSelection('nodes', allNodeIds)">
              <filter-row v-for="node in visibleNodes" :key="node.ID"
                :title="node.Description.Hostname" :selected="filters.nodesSelection.includes(node.ID)"
                :meta="node.Spec.Role" show-only
                @toggle="toggleSelection('nodes', [node.ID])" @only="onlySelection('nodes', [node.ID])"></filter-row>
            </filter-section>

            <filter-section title="STACKS" :state="servicesState" :open="isSectionOpen('STACKS')"
              @update:open="toggleSection('STACKS')" @toggle="toggleSelection('services', allServiceIds)">
              <template v-for="stack in visibleServicesGroups" :key="stack.name">
                <filter-row :title="stack.name" :state="stackState(stack)" strong show-only
                  :expandable="!searchActive" :open="isStackOpen(stack.name)"
                  @toggle="toggleSelection('services', stackServiceIds(stack))"
                  @only="onlySelection('services', stackServiceIds(stack))"
                  @update:open="toggleStackOpen(stack.name)"></filter-row>

                <template v-if="isStackOpen(stack.name)">
                  <filter-row v-for="service in stack.services" :key="service.ID" indent
                    :title="createServiceName(service)" :selected="filters.servicesSelection.includes(service.ID)"
                    @toggle="toggleSelection('services', [service.ID])">
                    <template #append>
                      <My-Details :service="service" v-slot="props">
                        <v-btn icon="mdi-chevron-right" v-bind="props" aria-label="Service Details"></v-btn>
                      </My-Details>
                    </template>
                  </filter-row>
                </template>
              </template>
            </filter-section>

            <filter-section title="NETWORKS" :state="networksState" :open="isSectionOpen('NETWORKS')"
              @update:open="toggleSection('NETWORKS')" @toggle="toggleSelection('networks', allNetworkIds)">
              <filter-row v-for="network in visibleNetworks" :key="network.Id"
                :title="network.Name" :selected="filters.networksSelection.includes(network.Id)" show-only
                @toggle="toggleSelection('networks', [network.Id])" @only="onlySelection('networks', [network.Id])"></filter-row>
              <filter-row v-if="!searchActive && networks.length" title="(none)" :selected="filters.networksSelection.includes('(none)')"
                @toggle="toggleSelection('networks', ['(none)'])"></filter-row>
            </filter-section>

            <div class="filter-section__header"><span class="filter-section__title">SORT</span></div>
            <v-select flat hide-details color="primary" bg-color="surface" :items="['Service Name', 'Created']"
              label="Sort by" :list-props="{ density: 'compact', rounded: 't-0' }" v-model="sort" single-line variant="solo"></v-select>

          </v-defaults-provider>
        </div>
      </v-navigation-drawer>
      <v-snackbar :model-value="wsState === 'reconnecting'" color="error" location="top" :timeout="-1">
        Connection lost — reconnecting...
      </v-snackbar>

      <v-main aria-label="Nodes and Services List">
        <v-container fluid>
          <v-list aria-label="Swarm Nodes" class="pa-0" style="overflow: initial; z-index: initial">
            <v-row class="d-flex flex-wrap ga-4">
              <v-col v-for="node in filteredNodes"
                :key="node.ID"
                class="server-card pa-1"
                style="max-width: 19rem"
                cols="auto"
              >
                <v-list-item :aria-label="node.Description.Hostname" class="pa-0">
                  <Node :node="node" :filters="debouncedFilters" :sort="sort" />
                </v-list-item>
              </v-col>
            </v-row>
            <v-row v-if="filteredNodes.length === 0" justify="center" class="mt-8">
              <v-col cols="auto">
                <v-empty-state
                  :headline="wsState === 'connecting' ? 'Connecting...' : 'No nodes match the current filters'"
                  :icon="wsState === 'connecting' ? 'mdi-lan-connect' : 'mdi-filter-off-outline'"
                />
              </v-col>
            </v-row>
          </v-list>
        </v-container>
      </v-main>
    </v-app>
  </div>

  <script type="module">
    import { computed, createApp, ref, shallowRef } from 'vue';
    import { createVuetify } from 'vuetify';
    import { useStorage, refDebounced } from '@vueuse/core';

    import MyDetails from './details.js';
    import { FilterRow, FilterSection } from './filters.js';
    import Node from './node.js';
    import Websocket from './websocket.js';

    const vuetify = createVuetify({
      theme: {
        defaultTheme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
    });

    createApp({
      setup() {
        const clusterName = shallowRef('');
        const authEnabled = shallowRef(false);
        const drawer = useStorage('drawer', true);
        const wsState = shallowRef('connecting');
        const filters = useStorage('filters.5', {
          filterText: '',
          networksSelection: new Array(),
          nodesSelection: new Array(),
          servicesSelection: new Array(),
          knownNetworkIds: new Array(),
          knownNodeIds: new Array(),
          knownServiceIds: new Array(),
          nodeRoles: false,
          serviceMode: false,
          taskStateFilter: false,
          openedStacks: ['default'],
          openedSections: ['NODES', 'STACKS', 'NETWORKS'],
          selectionsInitialized: false,
          // replicas: [0, 10]
        },
        undefined,
        {
          mergeDefaults: true,
          serializer: {
            read: (v) => v ? JSON.parse(v) : null,
            write: (v) => JSON.stringify(v),
          },
        });

        const sort = useStorage('sort', 'Service Name');
        const nodes = ref([]);
        const networks = ref([]);
        const services = ref([]);

        const vuetifyDefaults = ref({
          global: {
            density: 'compact',
          },
          VBtn: {
            density: 'compact',
            size: "small",
            slim: true,
            variant: "text"
          },
          VBtnToggle: {
            color: "primary",
            divided: true,
            rounded:"pill"
          },
          VCheckboxBtn: {
            color: "primary",
            density: "compact",
            hideDetails: true
          },
          VList: {
            slim: true,
          },
          VListGroup: {
            fluid: true,
          },
        })

        const debouncedFilterText = refDebounced(computed(() => filters.value.filterText), 250);
        const debouncedFilters = computed(() => ({ ...filters.value, filterText: debouncedFilterText.value }));

        const sortedNetworks = computed(() => [...networks.value].sort((a, b) => a.Name.localeCompare(b.Name)));
        const sortedNodes = computed(() => [...nodes.value].sort((a, b) => a.Description.Hostname.localeCompare(b.Description.Hostname)));
        const sortedServicesGroups = computed(() => {
          const stackMap = new Map();
          
          [...services.value]
          .sort((a, b) => a.Spec.Name.localeCompare(b.Spec.Name))
          .forEach(service => {
            const stackName = service.Spec.Labels?.['com.docker.stack.namespace'] || 'default';
            
            if (!stackMap.has(stackName)) {
              stackMap.set(stackName, { name: stackName, services: [] });
            }
            
            stackMap.get(stackName).services.push(service);
          });
          
          return Array.from(stackMap.values()).sort((a, b) => a.name.localeCompare(b.name));
        });
        const filteredNodes = computed(() => sortedNodes.value
          .filter(node => {
            if (!filters.value.nodeRoles) {
              return true;
            }
            return node.Spec.Role === filters.value.nodeRoles;
          })
          .filter(node => filters.value.nodesSelection.includes(node.ID))
          // Searching a hostname narrows to that node; searching a service name
          // keeps the nodes actually running it. Without this the drawer says
          // "swarm-wkr-01" while every node card stays up holding no tasks.
          .filter(node => {
            if (!debouncedQuery.value) return true;
            if (node.Description.Hostname.toLowerCase().includes(debouncedQuery.value)) return true;
            return (node.tasks || []).some(task => task.service
              && task.service.Spec.Name.toLowerCase().includes(debouncedQuery.value));
          })
        );

        function createServiceName(service) {
          if (service.Spec.Mode.Replicated !== undefined  && service.Spec.Mode.Replicated.Replicas !== undefined && service.Spec.Mode.Replicated.Replicas > 1) {
            return `${service.Spec.Name} (${service.Spec.Mode.Replicated.Replicas} replicas)`;
          }
          return service.Spec.Name;
        } 

        function getAuthorized() {
          window.location.href = window.location.pathname + 'login';
        }

        function logout() {
          window.location.href = window.location.pathname + 'logout';
        }

        // Selection lives in exactly one place per section: the flat *Selection
        // array. Every parent's checkbox and n/m tally is derived from it, so a
        // stack and its services can never disagree.
        const SELECTION_PROPS = {
          nodes: 'nodesSelection',
          services: 'servicesSelection',
          networks: 'networksSelection',
        };

        const allNodeIds = computed(() => nodes.value.map(node => node.ID));
        const allServiceIds = computed(() => services.value.map(service => service.ID));
        const allNetworkIds = computed(() => networks.value.length
          ? [...networks.value.map(network => network.Id), '(none)']
          : []);

        function selectionState(key, ids) {
          const selected = filters.value[SELECTION_PROPS[key]];
          const on = ids.reduce((count, id) => count + (selected.includes(id) ? 1 : 0), 0);
          return { on, total: ids.length, kind: on === ids.length ? 'all' : on === 0 ? 'none' : 'some' };
        }

        function setSelection(key, ids, on) {
          const prop = SELECTION_PROPS[key];
          const next = new Set(filters.value[prop]);
          ids.forEach(id => on ? next.add(id) : next.delete(id));
          filters.value[prop] = [...next];
        }

        function toggleSelection(key, ids) {
          setSelection(key, ids, selectionState(key, ids).kind !== 'all');
        }

        function onlySelection(key, ids) {
          filters.value[SELECTION_PROPS[key]] = [...ids];
        }

        const nodesState = computed(() => selectionState('nodes', allNodeIds.value));
        const servicesState = computed(() => selectionState('services', allServiceIds.value));
        const networksState = computed(() => selectionState('networks', allNetworkIds.value));

        function stackServiceIds(stack) {
          return stack.services.map(service => service.ID);
        }

        function stackState(stack) {
          return selectionState('services', stackServiceIds(stack));
        }

        function isSectionOpen(name) {
          return filters.value.openedSections.includes(name);
        }

        function toggleSection(name) {
          const open = filters.value.openedSections;
          const index = open.indexOf(name);
          index > -1 ? open.splice(index, 1) : open.push(name);
        }

        // While searching, every stack holding a match is open; the chevron is
        // hidden so expansion never fights the query.
        function isStackOpen(name) {
          return searchActive.value || filters.value.openedStacks.includes(name);
        }

        function toggleStackOpen(name) {
          const open = filters.value.openedStacks;
          const index = open.indexOf(name);
          index > -1 ? open.splice(index, 1) : open.push(name);
        }

        const query = computed(() => (filters.value.filterText || '').trim().toLowerCase());
        // The cards render off the debounced text, so match against the same
        // value or a card and its task list disagree for a beat.
        const debouncedQuery = computed(() => (debouncedFilterText.value || '').trim().toLowerCase());
        const searchActive = computed(() => query.value.length > 0);

        const matchingServiceIds = computed(() => searchActive.value
          ? services.value.filter(service => service.Spec.Name.toLowerCase().includes(query.value)).map(service => service.ID)
          : []);

        const visibleNodes = computed(() => searchActive.value
          ? sortedNodes.value.filter(node => node.Description.Hostname.toLowerCase().includes(query.value))
          : sortedNodes.value);

        const visibleNetworks = computed(() => searchActive.value
          ? sortedNetworks.value.filter(network => network.Name.toLowerCase().includes(query.value))
          : sortedNetworks.value);

        const visibleServicesGroups = computed(() => {
          if (!searchActive.value) return sortedServicesGroups.value;
          return sortedServicesGroups.value
            .map(stack => stack.name.toLowerCase().includes(query.value)
              ? stack
              : { name: stack.name, services: stack.services.filter(service => service.Spec.Name.toLowerCase().includes(query.value)) })
            .filter(stack => stack.services.length > 0);
        });

        const filterSummary = computed(() => {
          const chips = [
            { key: 'nodes', text: `Nodes ${nodesState.value.on}/${nodesState.value.total}`, active: nodesState.value.kind !== 'all' },
            { key: 'services', text: `Services ${servicesState.value.on}/${servicesState.value.total}`, active: servicesState.value.kind !== 'all' },
            { key: 'networks', text: `Networks ${networksState.value.on}/${networksState.value.total}`, active: networksState.value.kind !== 'all' },
          ];
          if (filters.value.nodeRoles) chips.push({ key: 'role', text: filters.value.nodeRoles === 'manager' ? 'Managers' : 'Workers', active: true });
          if (filters.value.serviceMode) chips.push({ key: 'mode', text: filters.value.serviceMode === 'global' ? 'Global' : 'Replicated', active: true });
          if (filters.value.taskStateFilter) chips.push({ key: 'state', text: filters.value.taskStateFilter === 'healthy' ? 'Healthy' : 'Stopped', active: true });
          if (searchActive.value) chips.push({ key: 'text', text: `"${filters.value.filterText.trim()}"`, active: true });
          return chips;
        });

        const activeFilters = computed(() => filterSummary.value.filter(chip => chip.active));

        function resetFilters() {
          filters.value.nodesSelection = [...allNodeIds.value];
          filters.value.servicesSelection = [...allServiceIds.value];
          filters.value.networksSelection = [...allNetworkIds.value];
          filters.value.nodeRoles = false;
          filters.value.serviceMode = false;
          filters.value.taskStateFilter = false;
          filters.value.filterText = '';
        }

        function updateReceivedData(data) {
          if (!data) return;
          clusterName.value = data.clusterName;
          authEnabled.value = data.authEnabled;

          networks.value = data.networks;

          if (!filters.value.selectionsInitialized) {
            filters.value.nodesSelection = data.nodes.map(node => node.ID);
            filters.value.servicesSelection = data.services.map(service => service.ID);
            // '(none)' is a real selectable bucket for services attached to no
            // network; seed it too, or those services are hidden on first load.
            filters.value.networksSelection = [...data.networks.map(network => network.Id), '(none)'];
            filters.value.knownNodeIds = [...filters.value.nodesSelection];
            filters.value.knownServiceIds = [...filters.value.servicesSelection];
            filters.value.knownNetworkIds = [...filters.value.networksSelection];
            filters.value.selectionsInitialized = true;
          } else {
            const newNetworkIds = data.networks
              .filter(network => !filters.value.knownNetworkIds.includes(network.Id))
              .map(network => network.Id);
            if (newNetworkIds.length > 0) {
              filters.value.networksSelection.push(...newNetworkIds);
              filters.value.knownNetworkIds.push(...newNetworkIds);
            }
          }

          services.value = data.services.map((service) => {
            service.index = data.services.findIndex((serv) => serv.ID === service.ID);
            if (service.Spec.TaskTemplate.Networks) {
              service.networks = service.Spec.TaskTemplate.Networks.map((network) => data.networks.find((n) => n.Id === network.Target));
            }
            return service;
          })

          if (filters.value.selectionsInitialized) {
            const newServiceIds = data.services
              .filter(service => !filters.value.knownServiceIds.includes(service.ID))
              .map(service => service.ID);
            if (newServiceIds.length > 0) {
              filters.value.servicesSelection.push(...newServiceIds);
              filters.value.knownServiceIds.push(...newServiceIds);
            }
          }

          nodes.value = data.nodes.map((node) => {
            if (data.tasks) {
              node.tasks = data.tasks
                .filter(task => task.NodeID === node.ID)
                .map((task) => {
                  task.service = services.value.find((service) => task.ServiceID === service.ID);
                  return task;
                });
            }

            return node;
          });

          if (filters.value.selectionsInitialized) {
            const newNodeIds = data.nodes
              .filter(node => !filters.value.knownNodeIds.includes(node.ID))
              .map(node => node.ID);
            if (newNodeIds.length > 0) {
              filters.value.nodesSelection.push(...newNodeIds);
              filters.value.knownNodeIds.push(...newNodeIds);
            }
          }

          // Prune stale IDs that no longer exist in the cluster
          const currentNodeIds = new Set(data.nodes.map(node => node.ID));
          const currentServiceIds = new Set(data.services.map(service => service.ID));
          const currentNetworkIds = new Set(data.networks.map(network => network.Id));
          filters.value.knownNodeIds = filters.value.knownNodeIds.filter(id => currentNodeIds.has(id));
          filters.value.knownServiceIds = filters.value.knownServiceIds.filter(id => currentServiceIds.has(id));
          filters.value.knownNetworkIds = filters.value.knownNetworkIds.filter(id => currentNetworkIds.has(id));
          filters.value.nodesSelection = filters.value.nodesSelection.filter(id => currentNodeIds.has(id));
          filters.value.servicesSelection = filters.value.servicesSelection.filter(id => currentServiceIds.has(id));
          filters.value.networksSelection = filters.value.networksSelection.filter(id => currentNetworkIds.has(id) || id === '(none)');
        }

        function onSystemThemeChange(event) {
          vuetify.theme.global.name.value = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }


        return {
          clusterName,
          authEnabled,
          drawer,
          wsState,
          vuetifyDefaults,
          filters,
          debouncedFilters,
          sort,
          networks,
          sortedNetworks,
          nodes,
          filteredNodes,
          sortedNodes,
          services,
          sortedServicesGroups,
          createServiceName,
          getAuthorized,
          logout,
          allNodeIds,
          allServiceIds,
          allNetworkIds,
          nodesState,
          servicesState,
          networksState,
          stackServiceIds,
          stackState,
          setSelection,
          toggleSelection,
          onlySelection,
          isSectionOpen,
          toggleSection,
          isStackOpen,
          toggleStackOpen,
          searchActive,
          matchingServiceIds,
          visibleNodes,
          visibleNetworks,
          visibleServicesGroups,
          filterSummary,
          activeFilters,
          resetFilters,
          updateReceivedData,
          onSystemThemeChange,
        };
      },

      components: {
        FilterRow,
        FilterSection,
        MyDetails,
        Node,
        Websocket,
      },

      mounted() {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', this.onSystemThemeChange);
      },
      beforeDestroy() {
        window.matchMedia('(prefers-color-scheme: dark)').removeEventListener('change', this.onSystemThemeChange);
      }
    }).use(vuetify).mount('#app');
  </script>
</body>

</html>
